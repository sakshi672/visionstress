[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionstress"
version = "0.1.0"
description = "Reproducible object detection robustness evaluation"
requires-python = ">=3.11"
dependencies = [
  "ultralytics>=8.3,<9",
  "pycocotools>=2.0.10,<3",
  "PyYAML>=6,<7",
  "opencv-python>=4.10,<6",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
report = ["pandas>=2,<3", "matplotlib>=3.9,<4", "Jinja2>=3.1,<4"]

[project.scripts]
visionstress = "visionstress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
