[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionstress"
version = "0.1.0"
description = "Reproducible object detection robustness evaluation"
requires-python = ">=3.11"
dependencies = [
  "ultralytics>=8.3,<9",
  "pycocotools>=2.0.10,<3",
  "PyYAML>=6,<7",
  "opencv-python>=4.10,<6",
  "numpy>=1.26,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
report = ["pandas>=2,<3", "matplotlib>=3.9,<4", "Jinja2>=3.1,<4"]

[project.scripts]
visionstress = "visionstress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
